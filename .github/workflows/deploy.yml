name: Deploy to production

on:
  push:
    branches: [ "main" ]

jobs:
  # print-stub-message:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Print Stub Message
  #       run: echo "Deploy disabled"
  
  deploy:
    name: Build image
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Load secrets and save to config/app.env
      run: aws secretsmanager get-secret-value --secret-id ytter --region eu-west-2 --query SecretString --output text | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > config/app.env

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ytter
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push -a $ECR_REGISTRY/$ECR_REPOSITORY

    - name: Update kube config
      run: |
        aws eks update-kubeconfig --name ytter-eks --region eu-west-2
        kubectl config current-context

    - name: Verify EKS API access
      run: |
        aws sts get-caller-identity
        aws eks describe-cluster --name ytter-eks --region eu-west-2 --query cluster.status --output text
        kubectl get namespaces

    - name: Deploy image to Amazon EKS
      run: |
        kubectl apply -f deployments/eks/aws-auth.yaml
        kubectl apply -f deployments/eks/deployment.yaml
        kubectl apply -f deployments/eks/service.yaml
        kubectl apply -f deployments/eks/issuer.yaml
        kubectl apply -f deployments/eks/ingress-nginx.yaml
        kubectl apply -f deployments/eks/ingress-http.yaml
        kubectl apply -f deployments/eks/ingress-grpc.yaml