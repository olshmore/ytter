name: Deploy to production

on:
  push:
    branches: [ "main" ]

jobs:
  # print-stub-message:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Print Stub Message
  #       run: echo "Deploy disabled"
  
  deploy:
    name: Build and deploy to ECS
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v5

    - name: Load deploy infra config
      run: |
        INFRA_ENV=deployments/ecs/infra.env
        if [[ ! -f "$INFRA_ENV" ]]; then
          if [[ -f deployments/ecs/infra.env.example ]]; then
            echo "missing $INFRA_ENV; using infra.env.example" >&2
            cp deployments/ecs/infra.env.example "$INFRA_ENV"
          else
            echo "missing $INFRA_ENV and infra.env.example" >&2
            exit 1
          fi
        fi
        set -a
        # shellcheck disable=SC1091
        source "$INFRA_ENV"
        set +a
        if [[ -z "${AWS_REGION:-}" || -z "${ECS_CLUSTER_NAME:-}" ]]; then
          echo "AWS_REGION and ECS_CLUSTER_NAME must be set in $INFRA_ENV" >&2
          exit 1
        fi
        echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_ENV"
        echo "ECS_CLUSTER_NAME=${ECS_CLUSTER_NAME}" >> "$GITHUB_ENV"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ytter
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
        docker push -a "$ECR_REGISTRY/$ECR_REPOSITORY"
        echo "ECR_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

    - name: Prepare app secrets
      env:
        ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
        MIGRATION_URL: ${{ vars.MIGRATION_URL }}
        GRPC_SERVER_ADDRESS: ${{ vars.GRPC_SERVER_ADDRESS }}
        REDIS_ADDRESS: ${{ vars.REDIS_ADDRESS }}
        GOOGLE_REDIRECT_URL: ${{ vars.GOOGLE_REDIRECT_URL }}
        DB_URL: ${{ secrets.DB_URL }}
        TOKEN_SYMMETRIC_KEY: ${{ secrets.TOKEN_SYMMETRIC_KEY }}
        EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
        EMAIL_SENDER_ADDRESS: ${{ secrets.EMAIL_SENDER_ADDRESS }}
        EMAIL_SENDER_PASSWORD: ${{ secrets.EMAIL_SENDER_PASSWORD }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        APP_SECRETS_FILE=deployments/ecs/app-secrets.env bash deployments/ecs/prepare-app-secrets.sh

    - name: Deploy to Amazon ECS
      run: bash deployments/ecs/deploy.sh production
