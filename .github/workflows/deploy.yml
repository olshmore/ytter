name: Deploy to production

on:
  push:
    branches: [ "main" ]

jobs:
  # print-stub-message:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Print Stub Message
  #       run: echo "Deploy disabled"
  
  deploy:
    name: Build image
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ytter
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push -a $ECR_REGISTRY/$ECR_REPOSITORY

    - name: Update kube config
      run: |
        aws eks update-kubeconfig --name ytter-eks --region eu-west-2
        kubectl config current-context

    - name: Verify EKS API access
      run: |
        aws sts get-caller-identity
        aws eks describe-cluster --name ytter-eks --region eu-west-2 --query cluster.status --output text
        kubectl get namespaces

    - name: Prepare app secrets for Kubernetes
      env:
        # Repository variables
        ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
        MIGRATION_URL: ${{ vars.MIGRATION_URL }}
        GRPC_SERVER_ADDRESS: ${{ vars.GRPC_SERVER_ADDRESS }}
        GOOGLE_REDIRECT_URL: ${{ vars.GOOGLE_REDIRECT_URL }}
        # Repository secrets
        DB_URL: ${{ secrets.DB_URL }}
        TOKEN_SYMMETRIC_KEY: ${{ secrets.TOKEN_SYMMETRIC_KEY }}
        EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
        EMAIL_SENDER_ADDRESS: ${{ secrets.EMAIL_SENDER_ADDRESS }}
        EMAIL_SENDER_PASSWORD: ${{ secrets.EMAIL_SENDER_PASSWORD }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        printf '%s\n' \
          "ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" \
          "FRONTEND_BASE_URL=${FRONTEND_BASE_URL}" \
          "MIGRATION_URL=${MIGRATION_URL}" \
          "GRPC_SERVER_ADDRESS=${GRPC_SERVER_ADDRESS}" \
          "EMAIL_SENDER_NAME=${EMAIL_SENDER_NAME}" \
          "EMAIL_SENDER_ADDRESS=${EMAIL_SENDER_ADDRESS}" \
          "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
          "GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}" \
          "DB_URL=${DB_URL}" \
          "TOKEN_SYMMETRIC_KEY=${TOKEN_SYMMETRIC_KEY}" \
          "EMAIL_SENDER_PASSWORD=${EMAIL_SENDER_PASSWORD}" \
          "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
          "OPENAI_API_KEY=${OPENAI_API_KEY}" \
          > deployments/eks/app-secrets.env

    - name: Deploy to Amazon EKS
      run: bash deployments/eks/deploy.sh app
