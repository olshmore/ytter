name: Deploy to production

on:
  push:
    branches: [ "main" ]

jobs:
  # print-stub-message:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Print Stub Message
  #       run: echo "Deploy disabled"
  
  deploy:
    name: Build image
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Load deploy infra config
      run: |
        set -a
        # shellcheck disable=SC1091
        source deployments/eks/infra.env
        set +a
        echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_ENV"
        echo "EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME}" >> "$GITHUB_ENV"

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ytter
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push -a $ECR_REGISTRY/$ECR_REPOSITORY

    - name: Update kube config
      run: |
        aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
        kubectl config current-context

    - name: Verify EKS API access
      run: |
        aws sts get-caller-identity
        aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query cluster.status --output text
        kubectl get namespaces

    - name: Prepare app secrets for Kubernetes
      env:
        # Repository variables
        ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
        MIGRATION_URL: ${{ vars.MIGRATION_URL }}
        GRPC_SERVER_ADDRESS: ${{ vars.GRPC_SERVER_ADDRESS }}
        REDIS_ADDRESS: ${{ vars.REDIS_ADDRESS }}
        GOOGLE_REDIRECT_URL: ${{ vars.GOOGLE_REDIRECT_URL }}
        # Repository secrets
        DB_URL: ${{ secrets.DB_URL }}
        TOKEN_SYMMETRIC_KEY: ${{ secrets.TOKEN_SYMMETRIC_KEY }}
        EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
        EMAIL_SENDER_ADDRESS: ${{ secrets.EMAIL_SENDER_ADDRESS }}
        EMAIL_SENDER_PASSWORD: ${{ secrets.EMAIL_SENDER_PASSWORD }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: bash deployments/eks/prepare-app-secrets.sh

    - name: Deploy to Amazon EKS
      run: bash deployments/eks/deploy.sh production
