syntax = "proto3";

package pb;

import "user.proto";

option go_package = "github.com/olshmore/ytter/pb";

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string role = 6;
}

message CreateUserResponse {
  User user = 1;
}