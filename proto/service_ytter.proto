syntax = "proto3";

package pb;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

import "rpc_create_user.proto";
import "rpc_update_user.proto";
import "rpc_login_user.proto";
import "rpc_list_users.proto";
import "rpc_refresh_token.proto";
import "rpc_verify_email.proto";
import "rpc_google_auth.proto";
import "rpc_public_booking.proto";
import "rpc_host_booking.proto";
import "rpc_host_slot.proto";
import "rpc_host_ai.proto";
import "rpc_host_service.proto";

option go_package = "github.com/olshmore/ytter/pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Ytter API";
    version: "1.1";
    contact: {
      name: "ytter";
      url: "https://github.com/olshmore/ytter";
      email: "olyshsuk@gmail.com";
    };
    description: "API with role-based access control. Roles: 'admin', 'host', and 'client'.";
  };
  security_definitions: {
    security: {
      key: "Bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Bearer token authentication. Format: 'Bearer <token>'. Required for authenticated endpoints.";
      };
    };
  };
  tags: {
    name: "auth";
    description: "Authentication endpoints";
  };
  tags: {
    name: "user";
    description: "User endpoints";
  };
  tags: {
    name: "booking";
    description: "Public booking endpoints";
  };
  tags: {
    name: "host_booking";
    description: "Host booking management";
  };
  tags: {
    name: "host_location";
    description: "Host location management";
  };
  tags: {
    name: "host_slot";
    description: "Host slot management";
  };
  tags: {
    name: "host_service";
    description: "Host service management";
  };
};

service Ytter {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to create a new user";
      summary: "Create new user";
      tags: "auth";
    };
  };
  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      get: "/v1/auth/verify_email"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to verify user's email";
      summary: "Verify email";
      tags: "auth";
    };
  };
  rpc LoginUser (LoginUserRequest) returns (LoginUserResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to login user";
      summary: "Login user";
      tags: "auth";
    };
  };
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to refresh access token. Public endpoint - validates refresh token from request body (not Bearer header).";
      summary: "Refresh token";
      tags: "auth";
    };
  };
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/user/list"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List users";
      description: "List users. Roles: admin";
      tags: "user";
      security: {
        security_requirement: {
          key: "Bearer";
          value: {};
        };
      };
    };
  };
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      patch: "/v1/user/update"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update user";
      description: "Update user. Roles: admin, host & client";
      tags: "user";
      security: {
        security_requirement: {
          key: "Bearer";
          value: {};
        };
      };
    };
