syntax = "proto3";

package pb;

option go_package = "github.com/olshmore/ytter/pb";

message HostLocationItem {
  string id = 1;
  string slug = 2;
  string name = 3;
  bool booking_requires_host_approval = 4;
  int32 cancellation_min_hours_before_start = 5;
  string owner_username = 6;
  string timezone = 7;
  bool is_active = 8;
  optional string logo_url = 9;
  optional string primary_color = 10;
  optional string accent_color = 11;
  optional string font_family = 12;
  optional string background_color = 13;
}

message ListHostLocationsRequest {}

message ListHostLocationsResponse {
  repeated HostLocationItem items = 1;
}

message CreateHostLocationRequest {
  string name = 1;
  string slug = 2;
  string timezone = 3;
  optional bool is_active = 4;
}

message CreateHostLocationResponse {
  HostLocationItem location = 1;
}

message GetHostLocationRequest {
  string location_id = 1;
}

message GetHostLocationResponse {
  HostLocationItem location = 1;
}

message GetHostLocationBySlugRequest {
  string location_slug = 1;
}

message GetHostLocationBySlugResponse {
  HostLocationItem location = 1;
}

message UpdateHostLocationRequest {
  string location_slug = 1;
  optional string name = 2;
  optional string slug = 3;
  optional string timezone = 4;
  optional bool is_active = 5;
  optional bool booking_requires_host_approval = 6;
}

message UpdateHostLocationResponse {
  HostLocationItem location = 1;
}

message UpdateLocationBrandingRequest {
  string location_slug = 1;
  optional string logo_url = 2;
  optional string primary_color = 3;
  optional string accent_color = 4;
  optional string font_family = 5;
  optional bool reset_all = 6;
  optional string background_color = 7;
}

message UpdateLocationBrandingResponse {
  string location_id = 1;
  string location_slug = 2;
  string location_name = 3;
  optional string logo_url = 4;
  optional string primary_color = 5;
  optional string accent_color = 6;
  optional string font_family = 7;
  optional string background_color = 8;
}

message CreateLocationBrandingLogoUploadRequest {
  string location_slug = 1;
  string content_type = 2;
  int64 content_length = 3;
}

message CreateLocationBrandingLogoUploadResponse {
  string upload_url = 1;
  string public_url = 2;
  string expires_at = 3;
}

message HostBookingSlotSummary {
  string slot_id = 1;
  string service_name = 2;
  string practitioner_name = 3;
  string room_name = 4;
  string start_at = 5;
  string end_at = 6;
}

message BookingLocationSummary {
  string id = 1;
  string slug = 2;
  string name = 3;
}

message HostBookingListItem {
  string booking_id = 1;
  string status = 2;
  string booked_at = 3;
  string guest_name = 4;
  string guest_email = 5;
  string guest_phone = 6;
  HostBookingSlotSummary slot = 7;
  string cancel_reason = 8;
  BookingLocationSummary location = 9;
  bool is_waitlist = 10;
}

message ListHostLocationBookingsRequest {
  string location_slug = 1;
  string status = 2;
  string from_date = 3;
  string to_date = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message ListHostLocationBookingsResponse {
  repeated HostBookingListItem items = 1;
  int32 total_count = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message HostBookingDetail {
  string id = 1;
  string location_id = 2;
  string slot_id = 3;
  string status = 4;
  string guest_name = 5;
  string guest_email = 6;
  string client_username = 7;
  string booked_at = 8;
}

message HostApproveBookingRequest {
  string booking_id = 1;
}

message HostApproveBookingResponse {
  HostBookingDetail booking = 1;
}

message HostRejectBookingRequest {
  string booking_id = 1;
  string cancel_reason = 2;
}

message HostRejectBookingResponse {}

message HostCancelBookingRequest {
  string booking_id = 1;
  string cancel_reason = 2;
}

message HostCancelBookingResponse {}

message HostSetBookingNoShowRequest {
  string booking_id = 1;
  bool no_show = 2;
}

message HostSetBookingNoShowResponse {
  HostBookingDetail booking = 1;
}

message GetHostSetupChecklistRequest {}

message GetHostSetupChecklistResponse {
  bool has_location = 1;
  bool has_service = 2;
  bool has_future_slot = 3;
  int32 progress_done_count = 4;
  bool ready_for_booking = 5;
  string sample_location_slug = 6;
}

message GetMyBookingRebookContextRequest {
  string booking_id = 1;
}

message RebookContextLocation {
  string id = 1;
  string slug = 2;
  string name = 3;
}

message RebookContextService {
  string id = 1;
  string name = 2;
}

message GetMyBookingRebookContextResponse {
  string source_booking_id = 1;
  RebookContextLocation location = 2;
  RebookContextService service = 3;
  string preferred_practitioner_id = 4;
  bool is_rebookable = 5;
  string reason_code = 6;
}

message GetHostBookingAnalyticsSummaryRequest {
  string location_slug = 1;
  string from_date = 2;
  string to_date = 3;
}

message GetHostBookingAnalyticsSummaryResponse {
  string location_slug = 1;
  string from_date = 2;
  string to_date = 3;
  double fill_rate = 4;
  double cancellation_rate = 5;
  double pending_approval_avg_minutes = 6;
  double no_show_proxy_rate = 7;
  string generated_at = 8;
}

message ListMyBookingsRequest {
  string status = 1;
  string from_date = 2;
  string to_date = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListMyBookingsResponse {
  repeated HostBookingListItem items = 1;
  int32 total_count = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message CancelMyBookingRequest {
  string booking_id = 1;
  string cancel_reason = 2;
}

message CancelMyBookingResponse {}
