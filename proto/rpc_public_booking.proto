syntax = "proto3";

package pb;

option go_package = "github.com/olshmore/ytter/pb";

message PublicSlotsLocation {
  string id = 1;
  string slug = 2;
  string name = 3;
  string timezone = 4;
  bool booking_requires_host_approval = 5;
  optional string logo_url = 6;
  optional string primary_color = 7;
  optional string accent_color = 8;
  optional string font_family = 9;
  optional string background_color = 10;
}

message PublicLocationItem {
  string id = 1;
  string slug = 2;
  string name = 3;
  string timezone = 4;
  bool booking_requires_host_approval = 5;
  optional string logo_url = 6;
  optional string primary_color = 7;
  optional string accent_color = 8;
  optional string font_family = 9;
  optional string background_color = 10;
}

message ListPublicLocationsRequest {}

message ListPublicLocationsResponse {
  repeated PublicLocationItem items = 1;
}

message PublicSlotsService {
  string id = 1;
  string name = 2;
  int32 duration_minutes = 3;
  int64 price_minor_units = 4;
  string currency = 5;
  int32 cancellation_min_hours_before_start = 6;
}

message PublicSlotsPractitioner {
  string id = 1;
  string name = 2;
  string display_name = 3;
}

message PublicSlotsRoom {
  string id = 1;
  string name = 2;
}

message PublicSlotsItem {
  string slot_id = 1;
  PublicSlotsService service = 2;
  PublicSlotsPractitioner practitioner = 3;
  PublicSlotsRoom room = 4;
  string start_at = 5;
  string end_at = 6;
  string availability_status = 7;
  bool is_bookable = 8;
  int32 capacity = 9;
  int32 booked_count = 10;
  int32 spaces_left = 11;
}

message ListPublicSlotsRequest {
  string location_slug = 1;
  string search = 2;
  string service_id = 3;
  string practitioner_id = 4;
  string room_id = 5;
  string date = 6;
  string time_slot = 7;
  bool only_available = 8;
  int32 limit = 9;
  int32 offset = 10;
}

message ListPublicSlotsResponse {
  PublicSlotsLocation location = 1;
  repeated PublicSlotsItem items = 2;
  int32 total_count = 3;
  int32 available_count = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message PublicCalendarAvailabilityDay {
  string date = 1;
  int32 available_count = 2;
  string state = 3;
}

message GetPublicCalendarAvailabilityRequest {
  string location_slug = 1;
  string month = 2;
  string service_id = 3;
  string timezone = 4;
}

message GetPublicCalendarAvailabilityResponse {
  string location_slug = 1;
  string service_id = 2;
  string month = 3;
  string timezone = 4;
  repeated PublicCalendarAvailabilityDay days = 5;
}

message PublicFilterService {
  string id = 1;
  string name = 2;
}

message PublicFilterPractitioner {
  string id = 1;
  string name = 2;
  string display_name = 3;
}

message PublicFilterRoom {
  string id = 1;
  string name = 2;
}

message GetPublicFilterOptionsRequest {
  string location_slug = 1;
}

message GetPublicFilterOptionsResponse {
  repeated PublicFilterService services = 1;
  repeated PublicFilterPractitioner practitioners = 2;
  repeated PublicFilterRoom rooms = 3;
  repeated string time_slots = 4;
}

message CreatePublicBookingRequest {
  string location_id = 1;
  string slot_id = 2;
  string guest_name = 3;
  string guest_email = 4;
  string guest_phone = 5;
  string guest_notes = 6;
}

message CreatePublicBookingBooking {
  string id = 1;
  string location_id = 2;
  string slot_id = 3;
  string status = 4;
  string guest_name = 5;
  string guest_email = 6;
  string client_username = 7;
  string booked_at = 8;
}

message CreatePublicBookingResponse {
  CreatePublicBookingBooking booking = 1;
  string cancel_token = 2;
}

message CancelPublicBookingRequest {
  string booking_id = 1;
  string cancel_token = 2;
  string cancel_reason = 3;
}

message CancelPublicBookingResponse {}

message JoinPublicWaitlistRequest {
  string location_id = 1;
  string service_id = 2;
  string slot_id = 3;
  string guest_name = 4;
  string guest_email = 5;
  string guest_phone = 6;
  string practitioner_id = 7;
  string preferred_date = 8;
}

message JoinPublicWaitlistResponse {
  string waitlist_entry_id = 1;
  string status = 2;
  int32 position_hint = 3;
}

message PublicBookingAssistantSuggestRequest {
  string prompt = 1;
  string location_slug = 2;
  string service_id = 3;
  string practitioner_id = 4;
  string room_id = 5;
  string date = 6;
}

message PublicBookingAssistantSlotSuggestion {
  string slot_id = 1;
  string start_at = 2;
  string end_at = 3;
  string service_name = 4;
  double confidence_hint = 5;
}

message PublicBookingAssistantSuggestResponse {
  string intent = 1;
  map<string, string> entities = 2;
  string clarifying_question = 3;
  repeated PublicBookingAssistantSlotSuggestion slot_suggestions = 4;
  double confidence = 5;
  string model = 6;
  string trace_id = 7;
}
