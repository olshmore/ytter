syntax = "proto3";

package pb;

option go_package = "github.com/olshmore/ytter/pb";

message HostServiceItem {
  string id = 1;
  string location_id = 2;
  string name = 3;
  string description = 4;
  int32 duration_minutes = 5;
  int64 price_minor_units = 6;
  string currency = 7;
  bool is_active = 8;
  optional int32 cancellation_min_hours_before_start = 9;
}

message ListHostLocationServicesRequest {
  string location_slug = 1;
  optional bool is_active = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListHostLocationServicesResponse {
  repeated HostServiceItem items = 1;
  int32 total_count = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message CreateHostLocationServiceRequest {
  string location_slug = 1;
  string name = 2;
  optional string description = 3;
  int32 duration_minutes = 4;
  int64 price_minor_units = 5;
  optional string currency = 6;
  optional bool is_active = 7;
  optional int32 cancellation_min_hours_before_start = 8;
}

message CreateHostLocationServiceResponse {
  HostServiceItem service = 1;
}

message UpdateHostLocationServiceRequest {
  string location_slug = 1;
  string service_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional int32 duration_minutes = 5;
  optional int64 price_minor_units = 6;
  optional string currency = 7;
  optional bool is_active = 8;
  optional int32 cancellation_min_hours_before_start = 9;
}

message UpdateHostLocationServiceResponse {
  HostServiceItem service = 1;
}
